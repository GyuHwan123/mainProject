services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # This URL is used by the browser, so Docker's internal `backend` hostname
      # is not reachable here. Override it with the public API URL in production.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - backend
    networks:
      - ocr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-768}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gemma2:2b}
      RECEIPTS_LLM_MODEL: ${RECEIPTS_LLM_MODEL:-}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-}
      RAG_PROMPT_VERSION: ${RAG_PROMPT_VERSION:-baseline-v1}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_CHUNK_TARGET_CHARS: ${RAG_CHUNK_TARGET_CHARS:-380}
      OCR_BASE_URL: http://ocr:8001
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_USERS_TABLE: ${SUPABASE_USERS_TABLE:-users}
      SUPABASE_OCR_DOCUMENTS_TABLE: ${SUPABASE_OCR_DOCUMENTS_TABLE:-ocr_documents}
      SUPABASE_DOCUMENTS_BUCKET: ${SUPABASE_DOCUMENTS_BUCKET:-documents}
    depends_on:
      - ollama
      - ocr
    networks:
      - ocr-network

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: ocr-engine
    ports:
      - "${OCR_PORT:-8001}:8001"
    networks:
      - ocr-network

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ocr-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_LLM_MODEL: ${RAG_LLM_MODEL:-llama3b-receipt-v3:latest}
      OLLAMA_RECEIPTS_MODEL: ${RECEIPTS_LLM_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
    networks:
      - ocr-network

volumes:
  ollama_data:

networks:
  ocr-network:
    driver: bridge
