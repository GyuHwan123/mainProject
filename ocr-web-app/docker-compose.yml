services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # This URL is used by the browser, so Docker's internal `backend` hostname
      # is not reachable here. Override it with the public API URL in production.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1024}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gemma2:2b}
      RECEIPTS_LLM_MODEL: ${RECEIPTS_LLM_MODEL:-}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_PROMPT_VERSION: ${RAG_PROMPT_VERSION:-baseline-v1}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_DENSE_CANDIDATE_COUNT: ${RAG_DENSE_CANDIDATE_COUNT:-12}
      RAG_BM25_CANDIDATE_COUNT: ${RAG_BM25_CANDIDATE_COUNT:-12}
      RAG_QUERY_REWRITING: ${RAG_QUERY_REWRITING:-true}
      RAG_QUERY_REWRITE_MODEL: ${RAG_QUERY_REWRITE_MODEL:-}
      RAG_QUERY_REWRITE_TIMEOUT_SECONDS: ${RAG_QUERY_REWRITE_TIMEOUT_SECONDS:-45}
      RAG_CHUNK_TARGET_CHARS: ${RAG_CHUNK_TARGET_CHARS:-380}
      OCR_BASE_URL: http://ocr:8001
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_USERS_TABLE: ${SUPABASE_USERS_TABLE:-users}
      SUPABASE_OCR_DOCUMENTS_TABLE: ${SUPABASE_OCR_DOCUMENTS_TABLE:-ocr_documents}
      SUPABASE_DOCUMENTS_BUCKET: ${SUPABASE_DOCUMENTS_BUCKET:-documents}
    depends_on:
      ollama:
        condition: service_healthy
      ocr:
        condition: service_healthy
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: ocr-engine
    ports:
      - "${OCR_PORT:-8001}:8001"
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ocr-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Local GGUF files are mounted read-only and are never copied into images.
      - ./models/rag:/models/rag:ro
      - ./models/receipts:/models/receipts:ro
    environment:
      OLLAMA_LLM_MODEL: ${RAG_LLM_MODEL:-gemma2:2b}
      OLLAMA_RECEIPTS_MODEL: ${RECEIPTS_LLM_MODEL:-}
      OLLAMA_RECEIPTS_MODELFILE: ${OLLAMA_RECEIPTS_MODELFILE:-}
      OLLAMA_RAG_MODEL: ${OLLAMA_RAG_MODEL:-}
      OLLAMA_RAG_GGUF_PATH: ${OLLAMA_RAG_GGUF_PATH:-}
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-models-ready && ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  ollama_data:

networks:
  ocr-network:
    driver: bridge
